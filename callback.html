<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Authorization - Lyrics Studio Uploader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Lyrics Studio Uploader</h1>
<div id="result"><p>Reading the authorization result...</p></div>
<p class="muted">This page only shows the result on your screen. Nothing is stored on this website.</p>
</main>
<script>
  // TikTok mengarahkan ke sini dengan ?code=...&state=... setelah tombol "Izinkan" ditekan.
  // Halaman ini menyusun perintah siap tempel untuk bot; tidak dikirim ke mana pun dari sini.
  const params = new URLSearchParams(location.search);
  const box = document.getElementById("result");
  const code = params.get("code");
  if (code) {
    const command = "/tiktok_kode " + code + " " + (params.get("state") || "");
    box.innerHTML =
      "<p>Authorization succeeded. Copy this line and send it to your bot:</p>" +
      "<p><code id='cmd' style='word-break: break-all'></code></p>" +
      "<button id='copy'>Copy</button> <span id='copied' class='muted'></span>";
    document.getElementById("cmd").textContent = command;
    document.getElementById("copy").onclick = () =>
      navigator.clipboard.writeText(command).then(() => {
        document.getElementById("copied").textContent = "Copied!";
      });
  } else if (params.get("error")) {
    box.innerHTML = "<p>Authorization was not completed: <code id='err'></code></p>";
    document.getElementById("err").textContent = params.get("error_description") || params.get("error");
  } else {
    box.innerHTML = "<p>No authorization data found on this page.</p>";
  }
</script>
</body>
</html>
